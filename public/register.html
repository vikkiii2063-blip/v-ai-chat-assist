<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>
<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#87CEEB;
font-family:Arial;
}

.box{
background:white;
padding:40px;
border-radius:20px;
width:320px;
box-shadow:0 0 20px rgba(0,0,0,0.2);
}

h1{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
margin-bottom:15px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

button{
width:100%;
padding:14px;
border:none;
background:#0ea5e9;
color:white;
font-size:16px;
border-radius:10px;
cursor:pointer;
}

a{
display:block;
text-align:center;
margin-top:15px;
}
</style>
</head>
<body>

<div class="box">
</html>
