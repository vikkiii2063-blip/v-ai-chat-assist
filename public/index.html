<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
display:flex;
height:100vh;
background:#87CEEB;
overflow:hidden;
}

.sidebar{
width:260px;
background:#021633;
color:white;
padding:20px;
display:flex;
flex-direction:column;
justify-content:space-between;
}

.logo{
font-size:32px;
font-weight:bold;
text-align:center;
margin-bottom:20px;
}

.new-chat{
background:#0ea5e9;
padding:15px;
border-radius:12px;
text-align:center;
cursor:pointer;
margin-bottom:20px;
}

.history{
flex:1;
overflow:auto;
}

.chat-item{
background:#112544;
padding:12px;
border-radius:10px;
margin-bottom:10px;
}

.logout{
background:red;
padding:14px;
border:none;
width:100%;
color:white;
border-radius:10px;
cursor:pointer;
margin-top:15px;
}

.main{
flex:1;
display:flex;
flex-direction:column;
position:relative;
}

.v-bg{
position:absolute;
font-size:500px;
font-weight:bold;
opacity:0.08;
top:50%;
left:50%;
transform:translate(-50%,-50%);
pointer-events:none;
color:white;
}

.topbar{
padding:20px;
font-size:38px;
font-weight:bold;
z-index:2;
}

.chat-box{
flex:1;
padding:20px;
overflow:auto;
z-index:2;
}

.message{
max-width:70%;
padding:15px;
margin-bottom:20px;
border-radius:20px;
line-height:1.5;
}

.user{
background:#0ea5e9;
color:white;
margin-left:auto;
}

.ai{
background:white;
color:black;
}

.review{
margin-top:10px;
font-size:22px;
}

.review span{
cursor:pointer;
margin-right:10px;
}

.input-area{
display:flex;
padding:20px;
gap:10px;
z-index:2;
}

.input-area input{
flex:1;
padding:18px;
border:none;
border-radius:40px;
font-size:18px;
outline:none;
}

.send-btn,
.voice-btn{
width:60px;
border:none;
border-radius:50%;
font-size:22px;
cursor:pointer;
color:white;
}

.send-btn{
background:#0ea5e9;
}

.voice-btn{
background:#021633;
}

</style>
</head>

<body>

<div class="sidebar">

<div>

<div class="logo">
V AI
</div>

<div class="new-chat" onclick="newChat()">
+ New Chat
</div>

<div class="history" id="history">
</div>

</div>

<div>

<input type="file">

<button class="logout">
Logout
</button>

</div>

</div>

<div class="main">

<div class="v-bg">
V
</div>

<div class="topbar">
V AI Assistant
</div>

<div class="chat-box" id="chatBox">
</div>

<div class="input-area">

<button class="voice-btn">
🎤
</button>

<input
type="text"
id="input"
placeholder="Ask anything..."
onkeypress="handleEnter(event)"
>

<button class="send-btn" onclick="sendMessage()">
➤
</button>

</div>

</div>

<script>

function handleEnter(e){

if(e.key === "Enter"){
sendMessage();
}

}

async function sendMessage(){

const input = document.getElementById("input");
const chatBox = document.getElementById("chatBox");
const history = document.getElementById("history");

const text = input.value.trim();

if(!text) return;

input.value = "";

chatBox.innerHTML += `
<div class="message user">
${text}
</div>
`;

try{

const response = await fetch("/chat", {
method: "POST",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify({
message: text
})
});

const data = await response.json();

chatBox.innerHTML += `
<div class="message ai">
${data.reply}

<div class="review">
<span>👍</span>
<span>👎</span>
</div>

</div>
`;

history.innerHTML += `
<div class="chat-item">
${text}
</div>
`;

chatBox.scrollTop = chatBox.scrollHeight;

}catch(err){

chatBox.innerHTML += `
<div class="message ai">
AI Error
</div>
`;

}

}

function newChat(){

document.getElementById("chatBox").innerHTML = "";

}

</script>

</body>
</html>
